  <rect x="596" y="130" width="8" height="80" rx="2" fill="#f5d040" opacity="0.88"/>
  <rect x="596" y="255" width="8" height="80" rx="2" fill="#f5d040" opacity="0.88"/>
  <rect x="596" y="380" width="8" height="80" rx="2" fill="#f5d040" opacity="0.88"/>
  <rect x="596" y="505" width="8" height="80" rx="2" fill="#f5d040" opacity="0.88"/>
  <!-- Surface evenness indicator line (slight reflection) -->
