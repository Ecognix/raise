      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="rg4" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#313131"/>
      <stop offset="60%" stop-color="#1d1d1d"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#rg4)"/>
  <rect width="1200" height="600" fill="#222" filter="url(#noise4)" opacity="0.5"/>
  <!-- Edge lines -->
  <rect x="62" y="0" width="6" height="600" fill="white" opacity="0.72"/>
  <rect x="1132" y="0" width="6" height="600" fill="white" opacity="0.72"/>
