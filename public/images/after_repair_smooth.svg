<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d2d2d"/>
      <stop offset="45%" stop-color="#1e1e1e"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.3"/>
      <stop offset="30%" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <!-- Road base - dark fresh asphalt -->
  <rect width="1200" height="600" fill="url(#roadGrad)"/>
  <!-- Texture noise -->
  <rect width="1200" height="600" fill="#252525" filter="url(#noise)" opacity="0.45"/>
  <!-- Slight surface sheen left side (lighting effect) -->
  <rect width="1200" height="600" fill="url(#sheen)" opacity="0.6"/>
  <!-- Left kerb edge white line -->
  <rect x="58" y="0" width="7" height="600" rx="2" fill="white" opacity="0.75"/>
  <!-- Right kerb edge white line -->
  <rect x="1135" y="0" width="7" height="600" rx="2" fill="white" opacity="0.75"/>
  <!-- Centre dashed yellow line -->
  <rect x="596" y="10" width="8" height="75" rx="2" fill="#f0cc40" opacity="0.9"/>
  <rect x="596" y="125" width="8" height="75" rx="2" fill="#f0cc40" opacity="0.9"/>
  <rect x="596" y="240" width="8" height="75" rx="2" fill="#f0cc40" opacity="0.9"/>
  <rect x="596" y="355" width="8" height="75" rx="2" fill="#f0cc40" opacity="0.9"/>
  <rect x="596" y="470" width="8" height="75" rx="2" fill="#f0cc40" opacity="0.9"/>
  <!-- Subtle aggregate texture dots -->
  <circle cx="150" cy="80" r="2" fill="#444" opacity="0.4"/>
  <circle cx="310" cy="200" r="1.5" fill="#555" opacity="0.35"/>
  <circle cx="800" cy="350" r="2" fill="#444" opacity="0.4"/>
  <circle cx="950" cy="150" r="1.5" fill="#555" opacity="0.35"/>
  <circle cx="400" cy="450" r="2" fill="#444" opacity="0.4"/>
  <circle cx="700" cy="520" r="1.5" fill="#555" opacity="0.35"/>
  <!-- Label overlay -->
  <rect x="0" y="555" width="1200" height="45" fill="#000" opacity="0.5"/>
  <text x="600" y="583" font-family="'Courier New',monospace" font-size="16" fill="#6ee7b7" text-anchor="middle" opacity="0.9">POST-REPAIR ✓  Fresh Bituminous Surface Course — All Defects Resolved — PCI 92/100</text>
</svg>
